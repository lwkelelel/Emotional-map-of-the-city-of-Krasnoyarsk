<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить место</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .form-card {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { color: #1e293b; margin-bottom: 24px; font-size: 24px; }
        label { display: block; color: #334155; margin-bottom: 8px; font-weight: 500; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input { width: auto; margin: 0; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .back { display: inline-block; margin-top: 20px; color: #667eea; text-decoration: none; }
        .alert { padding: 12px; border-radius: 12px; margin-bottom: 20px; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .section-title {
            color: #667eea;
            font-size: 16px;
            margin: 20px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        small { color: #64748b; font-size: 11px; display: block; margin-top: -15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>➕ Добавить место</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <label>Название *</label>
            <input type="text" name="name" required>

            <label>Категория *</label>
            <select name="category_id" required>
                <option value="">Выберите</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
                {% endfor %}
            </select>

            <label>Описание *</label>
            <textarea name="description" rows="4" required></textarea>

            <label>Адрес *</label>
            <input type="text" name="address" placeholder="ул. Мира, 1" required>
            <small>Координаты определятся автоматически</small>

            <div class="section-title">📷 Фотография</div>
            <label>Ссылка на фото</label>
            <input type="text" name="photo_url" placeholder="https://...">
            <div class="row-2">
                <div><label>Источник</label><input type="text" name="photo_source" placeholder="Фотосток"></div>
                <div><label>Автор</label><input type="text" name="photo_author" placeholder="Имя автора"></div>
            </div>

            <div class="section-title">🎵 Музыкальный трек</div>
            <label>Ссылка на MP3</label>
            <input type="text" name="track_url" placeholder="https://...">
            <div class="row-2">
                <div><label>Название</label><input type="text" name="track_title" placeholder="Название"></div>
                <div><label>Автор</label><input type="text" name="track_author" placeholder="Композитор"></div>
            </div>
            <label>Год смерти автора (должен быть < 1955)</label>
            <input type="number" name="track_author_death_year" placeholder="Например: 1950">

            <div class="section-title">♿ Доступность</div>
            <div class="checkbox-group">
                <input type="checkbox" name="wifi_free" id="wifi">
                <label for="wifi">📶 Бесплатный Wi-Fi</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" name="wheelchair_accessible" id="wheelchair">
                <label for="wheelchair">♿ Доступно для инвалидов</label>
            </div>

            <button type="submit">💾 Сохранить</button>
        </form>
        <a href="/admin" class="back">← Назад</a>
    </div>
</body>
</html>
