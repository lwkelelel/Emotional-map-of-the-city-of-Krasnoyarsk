<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать администратора</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .form-card {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { margin-bottom: 24px; color: #1a202c; font-size: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #2d3748; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input { width: auto; margin: 0; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .back { display: inline-block; margin-top: 20px; color: #667eea; text-decoration: none; }
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .alert-error { background: #fed7d7; color: #c53030; }
        .alert-success { background: #c6f6d5; color: #276749; }
    </style>
</head>
<body>
    <div class="form-card">
        <h1>➕ Создать администратора</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <label>Логин *</label>
            <input type="text" name="username" required>

            <label>Email *</label>
            <input type="email" name="email" required>

            <label>Полное имя</label>
            <input type="text" name="full_name">

            <label>Пароль * (мин. 6 символов)</label>
            <input type="password" name="password" required>

            <div class="checkbox-group">
                <input type="checkbox" name="is_super_admin" id="super">
                <label for="super">⭐ Супер-администратор (полный доступ)</label>
            </div>

            <button type="submit">Создать</button>
        </form>
        <a href="/admin/admins" class="back">← Назад</a>
    </div>
</body>
</html>
