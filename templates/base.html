<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Эмоциональная карта города Красноярска{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированные фоновые сферы — яркие и насыщенные */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            animation: float 25s infinite ease-in-out;
        }

        /* Основные яркие пятна */
        .bg-blob-1 { width: 550px; height: 550px; background: #8b5cf6; top: -200px; left: -150px; animation-delay: 0s; box-shadow: 0 0 80px rgba(139, 92, 246, 0.5); }
        .bg-blob-2 { width: 600px; height: 600px; background: #ec4899; bottom: -250px; right: -200px; animation-delay: -4s; box-shadow: 0 0 80px rgba(236, 72, 153, 0.5); }
        .bg-blob-3 { width: 400px; height: 400px; background: #f59e0b; top: 30%; left: 15%; animation-delay: -7s; box-shadow: 0 0 80px rgba(245, 158, 11, 0.5); }
        .bg-blob-4 { width: 500px; height: 500px; background: #10b981; bottom: 15%; right: 10%; animation-delay: -10s; box-shadow: 0 0 80px rgba(16, 185, 129, 0.5); }
        .bg-blob-5 { width: 350px; height: 350px; background: #3b82f6; top: 60%; left: 70%; animation-delay: -13s; box-shadow: 0 0 80px rgba(59, 130, 246, 0.5); }
        .bg-blob-6 { width: 450px; height: 450px; background: #ef4444; top: 10%; right: 25%; animation-delay: -16s; box-shadow: 0 0 80px rgba(239, 68, 68, 0.5); }
        .bg-blob-7 { width: 300px; height: 300px; background: #06b6d4; bottom: 35%; left: 5%; animation-delay: -19s; box-shadow: 0 0 80px rgba(6, 182, 212, 0.5); }
        .bg-blob-8 { width: 480px; height: 480px; background: #a855f7; top: 45%; right: -100px; animation-delay: -22s; box-shadow: 0 0 80px rgba(168, 85, 247, 0.5); }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-40px, 30px) scale(1.08); }
            50% { transform: translate(30px, -35px) scale(0.92); }
            75% { transform: translate(-25px, -20px) scale(1.05); }
        }

        /* Светлая тема — более светлые пятна */
        body.light-theme .bg-blob-1 { background: #a78bfa; opacity: 0.35; }
        body.light-theme .bg-blob-2 { background: #f472b6; opacity: 0.3; }
        body.light-theme .bg-blob-3 { background: #fbbf24; opacity: 0.35; }
        body.light-theme .bg-blob-4 { background: #34d399; opacity: 0.3; }
        body.light-theme .bg-blob-5 { background: #60a5fa; opacity: 0.35; }
        body.light-theme .bg-blob-6 { background: #f87171; opacity: 0.3; }
        body.light-theme .bg-blob-7 { background: #22d3ee; opacity: 0.35; }
        body.light-theme .bg-blob-8 { background: #c084fc; opacity: 0.3; }
        body.light-theme { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f1f5f9 100%); }

        /* УМЕНЬШЕННАЯ ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            background: linear-gradient(90deg, rgba(26, 21, 54, 0.85) 0%, rgba(15, 12, 41, 0.9) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            z-index: 99999;
            border-bottom: 1px solid rgba(167, 139, 250, 0.25);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        body.light-theme .top-bar {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 6px rgba(0,0,0,0.05);
        }

        /* Логотип */
        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo-text {
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-theme .logo-text {
            background: linear-gradient(135deg, #1e293b 0%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 32px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s ease;
            border: none !important;
            outline: none !important;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        body.light-theme .nav-links a { color: #475569; }
        .nav-links a:hover {
            color: #ffffff;
            background: rgba(167, 139, 250, 0.12);
            transform: translateY(-1px);
        }
        body.light-theme .nav-links a:hover {
            color: #0f172a;
            background: rgba(0, 0, 0, 0.04);
        }

        .main-container {
            position: relative;
            z-index: 5;
            padding-top: 52px;
            min-height: 100vh;
        }

        .container-fluid {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        @media (max-width: 768px) {
            .top-bar { height: 48px; padding: 0 16px; }
            .logo { font-size: 14px; gap: 5px; }
            .nav-links a { padding: 5px 10px; font-size: 11px; gap: 3px; }
            .main-container { padding-top: 48px; }
        }

        @media (max-width: 640px) {
            .logo { font-size: 12px; }
            .logo-text { font-size: 11px; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body id="body">
    <div class="bg-animation">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
        <div class="bg-blob bg-blob-4"></div>
        <div class="bg-blob bg-blob-5"></div>
        <div class="bg-blob bg-blob-6"></div>
        <div class="bg-blob bg-blob-7"></div>
        <div class="bg-blob bg-blob-8"></div>
    </div>

    <div class="top-bar">
        <a href="/" class="logo">

            🗺️ <span class="logo-text">Эмоциональная карта Красноярска</span>
        </a>
        <div class="nav-links">
            <a href="/"><i class="fas fa-map-marked-alt"></i> Карта</a>
            <a href="/ideas"><i class="fas fa-lightbulb"></i> Идеи</a>
            <a href="/suggest"><i class="fas fa-plus-circle"></i> Предложить</a>
            <a href="/about"><i class="fas fa-info-circle"></i> О проекте</a>
            <a href="/settings"><i class="fas fa-cog"></i> Настройки</a>
        </div>
    </div>

    <div class="main-container">
        <div class="container-fluid p-0">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function applyTheme() {
            const isDark = localStorage.getItem('darkTheme') === 'true';
            if (isDark) {
                document.getElementById('body').classList.remove('light-theme');
            } else {
                document.getElementById('body').classList.add('light-theme');
            }
        }
        applyTheme();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
