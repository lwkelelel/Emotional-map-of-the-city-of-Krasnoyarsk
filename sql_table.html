{% block extra_js %}
<script>
    function copyAllSQL() {
        const sqlBlocks = [
            document.getElementById('sql-categories').innerText,
            document.getElementById('sql-places').innerText,
            document.getElementById('sql-suggested').innerText,
            document.getElementById('sql-admins').innerText,
            document.getElementById('sql-votes').innerText,
            document.getElementById('sql-indexes').innerText
        ];
        const fullSQL = sqlBlocks.join('\n\n');

        navigator.clipboard.writeText(fullSQL).then(() => {
            alert('✅ SQL-код скопирован в буфер обмена');
        }).catch(() => {
            alert('❌ Не удалось скопировать');
        });
    }
</script>
{% endblock %}
